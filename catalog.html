<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>款式｜简衣购</title>
    <meta name="description" content="简衣购全部款式，广州包邮发货，全国均可送达。" />

    <link rel="icon" href="assets/favicon.png" type="image/png" />

  <body>
    <a class="skip" href="#main">跳到主要内容</a>

    <!-- 1. 顶部双格公告 -->
    <div class="notice" role="note" aria-label="站点公告">
      <div class="notice__cell"><span>全国均可发货</span></div>
      <div class="notice__cell"><span>广州仓当日发货</span></div>
    </div>

    <header class="site-header">
      <nav class="nav nav--left" aria-label="主导航">
        <a href="index.html">首页</a>
      </nav>

      <a class="brand" href="index.html" aria-label="简衣购 首页"><img src="assets/logo-header.png" alt="JYG 简衣购" width="182" height="50" decoding="async" /></a>

      <nav class="nav nav--right" aria-label="产品导航">
        <a href="catalog.html" aria-current="page">款式</a>
      </nav>
    </header>

    <main id="main" class="catalog">
      <div class="catalog__head">
        <h1 class="catalog__title">全部款式</h1>
        <p class="catalog__count">共 1 件</p>
      </div>

      <div class="grid">
        <article class="card">
          <a class="card__media" href="product.html" aria-label="珠地棉短袖 POLO 衫">
            <img src="assets/product/polo-white.webp" alt="珠地棉短袖 POLO 衫 白色" width="900" height="1204" loading="lazy" />
          </a>

          <a class="card__name" href="product.html">珠地棉短袖 POLO 衫</a>

          <div class="card__meta">
            <span class="card__price">¥379.00</span>
            <button class="card__fav" type="button" aria-label="收藏珠地棉短袖 POLO 衫" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 20.2s-7.4-4.7-7.4-9.6A4.2 4.2 0 0 1 12 7.6a4.2 4.2 0 0 1 7.4 3c0 4.9-7.4 9.6-7.4 9.6z" />
              </svg>
            </button>
          </div>
          <div class="card__colors" role="group" aria-label="珠地棉短袖 POLO 衫 可选颜色">
            <button class="dot" type="button" data-img="assets/product/polo-white.webp" data-alt="珠地棉短袖 POLO 衫 白色" style="background:#f7f7f5" aria-label="白" aria-pressed="true"></button>
            <button class="dot" type="button" data-img="assets/product/polo-grey.webp" data-alt="珠地棉短袖 POLO 衫 灰色" style="background:#b7b7b7" aria-label="灰" aria-pressed="false"></button>
            <button class="dot" type="button" data-img="assets/product/polo-wine.webp" data-alt="珠地棉短袖 POLO 衫 酒红" style="background:#6d1b2e" aria-label="酒红" aria-pressed="false"></button>
            <button class="dot" type="button" data-img="assets/product/polo-black.webp" data-alt="珠地棉短袖 POLO 衫 黑色" style="background:#1b1b1b" aria-label="黑" aria-pressed="false"></button>
          </div>
        </article>
      </div>
    </main>

            class="social"

            rel="noopener noreferrer"

              rel="noopener noreferrer"
